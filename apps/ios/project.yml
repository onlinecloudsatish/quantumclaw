name: QuantumClaw
options:
  bundleIdPrefix: ai.quantumclaw
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO

packages:
  QuantumClawKit:
    path: ../shared/QuantumClawKit
  Swabble:
    path: ../../Swabble

schemes:
  QuantumClaw:
    shared: true
    build:
      targets:
        QuantumClaw: all
    test:
      targets:
        - QuantumClawTests
        - QuantumClawLogicTests
  QuantumClawLogicTests:
    shared: true
    build:
      targets:
        QuantumClawLogicTests: all
    test:
      targets:
        - QuantumClawLogicTests

targets:
  QuantumClaw:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Sources
    dependencies:
      - target: QuantumClawShareExtension
        embed: true
      - target: QuantumClawActivityWidget
        embed: true
      - target: QuantumClawWatchApp
      - package: QuantumClawKit
      - package: QuantumClawKit
        product: QuantumClawChatUI
      - package: QuantumClawKit
        product: QuantumClawProtocol
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    preBuildScripts:
      - name: SwiftFormat (lint)
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftformat >/dev/null 2>&1; then
            echo "error: swiftformat not found (brew install swiftformat)" >&2
            exit 1
          fi
          swiftformat --lint --config "$SRCROOT/../../.swiftformat" \
            --filelist "$SRCROOT/SwiftSources.input.xcfilelist"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        inputFileLists:
          - $(SRCROOT)/SwiftSources.input.xcfilelist
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "error: swiftlint not found (brew install swiftlint)" >&2
            exit 1
          fi
          swiftlint lint --config "$SRCROOT/.swiftlint.yml" --use-script-input-file-lists
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Sources/QuantumClaw.entitlements
        CODE_SIGN_STYLE: "$(QUANTUMCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(QUANTUMCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(QUANTUMCLAW_APP_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(QUANTUMCLAW_APP_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
      configs:
        Debug:
          QUANTUMCLAW_PUSH_TRANSPORT: direct
          QUANTUMCLAW_PUSH_DISTRIBUTION: local
          QUANTUMCLAW_PUSH_RELAY_BASE_URL: ""
          QUANTUMCLAW_PUSH_APNS_ENVIRONMENT: sandbox
        Release:
          QUANTUMCLAW_PUSH_TRANSPORT: direct
          QUANTUMCLAW_PUSH_DISTRIBUTION: local
          QUANTUMCLAW_PUSH_RELAY_BASE_URL: ""
          QUANTUMCLAW_PUSH_APNS_ENVIRONMENT: production
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: QuantumClaw
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: ai.quantumclaw.ios
            CFBundleURLSchemes:
              - quantumclaw
        CFBundleShortVersionString: "$(QUANTUMCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(QUANTUMCLAW_BUILD_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - ai.quantumclaw.ios.bgrefresh
        NSLocalNetworkUsageDescription: QuantumClaw discovers and connects to your QuantumClaw gateway on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSBonjourServices:
          - _quantumclaw-gw._tcp
        NSCameraUsageDescription: QuantumClaw can capture photos or short video clips when requested via the gateway.
        NSLocationWhenInUseUsageDescription: QuantumClaw uses your location when you allow location sharing.
        NSLocationAlwaysAndWhenInUseUsageDescription: QuantumClaw can share your location in the background when you enable Always.
        NSMicrophoneUsageDescription: QuantumClaw needs microphone access for voice wake.
        NSMotionUsageDescription: QuantumClaw may use motion data to support device-aware interactions and automations.
        NSPhotoLibraryUsageDescription: QuantumClaw needs photo library access when you choose existing photos to share with your assistant.
        NSSpeechRecognitionUsageDescription: QuantumClaw uses on-device speech recognition for voice wake.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        QuantumClawPushTransport: "$(QUANTUMCLAW_PUSH_TRANSPORT)"
        QuantumClawPushDistribution: "$(QUANTUMCLAW_PUSH_DISTRIBUTION)"
        QuantumClawPushRelayBaseURL: "$(QUANTUMCLAW_PUSH_RELAY_BASE_URL)"
        QuantumClawPushAPNsEnvironment: "$(QUANTUMCLAW_PUSH_APNS_ENVIRONMENT)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  QuantumClawShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: QuantumClawKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(QUANTUMCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(QUANTUMCLAW_DEVELOPMENT_TEAM)"
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(QUANTUMCLAW_SHARE_BUNDLE_ID)"
        PROVISIONING_PROFILE_SPECIFIER: "$(QUANTUMCLAW_SHARE_PROFILE)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: QuantumClaw Share
        CFBundleShortVersionString: "$(QUANTUMCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(QUANTUMCLAW_BUILD_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 1

  QuantumClawActivityWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: ActivityWidget
      - path: Sources/LiveActivity/QuantumClawActivityAttributes.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(QUANTUMCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(QUANTUMCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(QUANTUMCLAW_ACTIVITY_WIDGET_BUNDLE_ID)"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SUPPORTS_LIVE_ACTIVITIES: YES
    info:
      path: ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: QuantumClaw Activity
        CFBundleShortVersionString: "$(QUANTUMCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(QUANTUMCLAW_BUILD_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  QuantumClawWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchApp
    dependencies:
      - target: QuantumClawWatchExtension
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APPINTENTS_METADATA: NO
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        PRODUCT_BUNDLE_IDENTIFIER: "$(QUANTUMCLAW_WATCH_APP_BUNDLE_ID)"
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: QuantumClaw
        CFBundleShortVersionString: "$(QUANTUMCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(QUANTUMCLAW_BUILD_VERSION)"
        WKCompanionAppBundleIdentifier: "$(QUANTUMCLAW_APP_BUNDLE_ID)"
        WKWatchKitApp: true

  QuantumClawWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchExtension/Sources
    dependencies:
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
      - sdk: UserNotifications.framework
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(QUANTUMCLAW_WATCH_EXTENSION_BUNDLE_ID)"
    info:
      path: WatchExtension/Info.plist
      properties:
        CFBundleDisplayName: QuantumClaw
        CFBundleShortVersionString: "$(QUANTUMCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(QUANTUMCLAW_BUILD_VERSION)"
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: "$(QUANTUMCLAW_WATCH_APP_BUNDLE_ID)"
          NSExtensionPointIdentifier: com.apple.watchkit

  QuantumClawTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          - Logic
    dependencies:
      - target: QuantumClaw
      - package: Swabble
        product: SwabbleKit
      - sdk: AppIntents.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(QUANTUMCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(QUANTUMCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.quantumclaw.ios.tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QuantumClaw.app/QuantumClaw"
        BUNDLE_LOADER: "$(TEST_HOST)"
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: QuantumClawTests
        CFBundleShortVersionString: "$(QUANTUMCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(QUANTUMCLAW_BUILD_VERSION)"

  QuantumClawLogicTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Tests/Logic
    dependencies:
      - package: QuantumClawKit
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "$(QUANTUMCLAW_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(QUANTUMCLAW_DEVELOPMENT_TEAM)"
        PRODUCT_BUNDLE_IDENTIFIER: ai.quantumclaw.ios.logic-tests
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests/Info.plist
      properties:
        CFBundleDisplayName: QuantumClawLogicTests
        CFBundleShortVersionString: "$(QUANTUMCLAW_MARKETING_VERSION)"
        CFBundleVersion: "$(QUANTUMCLAW_BUILD_VERSION)"
