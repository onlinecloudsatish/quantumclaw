services:
  - type: web
    name: quantumclaw
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: QUANTUMCLAW_STATE_DIR
        value: /data/.quantumclaw
      - key: QUANTUMCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: QUANTUMCLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: quantumclaw-data
      mountPath: /data
      sizeGB: 1
